<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4B465"/>
      <stop offset="100%" stop-color="#626F47"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#A4B465" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Fundo escuro arredondado -->
  <rect width="64" height="64" rx="14" fill="#0c110a" stroke="#626F47" stroke-width="2"/>
  <!-- Escudo Cyber -->
  <path d="M32 6 L54 15 V31 C54 45.5 44.5 55.5 32 59 C19.5 55.5 10 45.5 10 31 V15 Z"
        fill="#141b11" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#glow)" stroke-linejoin="round"/>
  <!-- Símbolo Terminal >_ dentro do escudo -->
  <path d="M21 24 L30 31 L21 38" fill="none" stroke="#F0BB78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="33" y1="39" x2="43" y2="39" stroke="#A4B465" stroke-width="4" stroke-linecap="round"/>
</svg>
